<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozon — аналитика продавца</title>
<!-- Библиотеки: только classic-скрипты с cdnjs, без ES-модулей -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e1015;--panel:#151821;--panel2:#1b1f2a;--line:#272c39;--line2:#323848;
  --text:#e6e8ee;--muted:#8e96a9;--dim:#636b7e;
  --accent:#5b8cff;--accent2:#3a64c9;--good:#36c47c;--warn:#efa53b;--bad:#ee5b60;
  --na:#b39dff;--na-bg:rgba(179,157,255,.10);--good-bg:rgba(54,196,124,.12);--bad-bg:rgba(238,91,96,.12);--warn-bg:rgba(239,165,59,.12);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num,td.num,th.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent2)}
button.ghost{background:transparent}
button.sm{padding:3px 8px;font-size:12px}
input[type=number],input[type=text],input[type=date],input[type=month],input[type=search],select{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.ver{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:2px 8px}
.grow{flex:1}
.period{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wrap{max-width:1480px;margin:0 auto;padding:16px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:12px}header.top{padding:10px 12px}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:108px}
.kpi .l{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted);margin-top:5px}
.covbar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:7px}
.covbar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.excluded{margin-top:8px;font-size:12px;color:var(--muted);background:var(--na-bg);border:1px dashed rgba(179,157,255,.35);border-radius:8px;padding:7px 10px}
.excluded b{color:var(--na)}
nav.tabs{display:flex;gap:2px;margin:16px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 14px;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px;font-weight:650}
.card h3 small{font-weight:400;color:var(--muted);margin-left:6px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}
.na{color:var(--na);background:var(--na-bg);border-radius:5px;padding:0 5px;font-size:12px;font-weight:500;white-space:nowrap;cursor:help}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chip{display:inline-block;font-size:11px;border-radius:20px;padding:1px 8px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:rgba(54,196,124,.4);background:var(--good-bg)}
.chip.bad{color:var(--bad);border-color:rgba(238,91,96,.4);background:var(--bad-bg)}
.chip.warn{color:var(--warn);border-color:rgba(239,165,59,.4);background:var(--warn-bg)}
.chip.na{border-color:rgba(179,157,255,.4)}
.chip.src-report{color:#7fd0ff;border-color:rgba(127,208,255,.4)}
.chip.src-manual{color:#ffd37f;border-color:rgba(255,211,127,.4)}
.tblwrap{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;z-index:1;white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--text)}
th .ar{color:var(--accent)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(91,140,255,.05)}
tr.detail>td{background:var(--bg);padding:14px}
td .nm{max-width:330px;white-space:normal;line-height:1.3}
td .sub{font-size:11px;color:var(--dim)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters input[type=search]{width:260px}
.insights{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.insights li{padding:9px 12px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--line2)}
.insights li.bad{border-left-color:var(--bad);color:var(--text)}
.insights li.warn{border-left-color:var(--warn);color:var(--text)}
.insights li.good{border-left-color:var(--good);color:var(--text)}
.insights li.na{border-left-color:var(--na);color:var(--text);background:var(--panel2);font-size:14px;padding:9px 12px;cursor:default;white-space:normal;font-weight:400}
.chartbox{position:relative;height:300px}
.chartbox.sm{height:220px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);background:var(--panel)}
.empty b{color:var(--text)}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);background:var(--panel)}
.drop.over{border-color:var(--accent);background:rgba(91,140,255,.06)}
.res{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel);margin-bottom:10px}
.res.ok{border-left:3px solid var(--good)}.res.err{border-left:3px solid var(--bad)}.res.ask{border-left:3px solid var(--warn)}
.res h4{margin:0 0 6px;font-size:14px}
.res dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:6px 0 0;font-size:13px}
.res dt{color:var(--muted)}.res dd{margin:0}
.res ul{margin:4px 0 0;padding-left:18px}
.uploadpanel{margin-top:12px}
.bar{position:relative;height:22px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:visible;margin:6px 0 4px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff}
.bar .mark::after{content:attr(data-l);position:absolute;top:-17px;left:-30px;width:60px;text-align:center;font-size:10px;color:var(--muted)}
.bar.nofact{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 8px,var(--na-bg) 8px,var(--na-bg) 16px)}
.wf{display:grid;grid-template-columns:150px 1fr 100px;gap:4px 10px;align-items:center;font-size:12px}
.wf .t{height:12px;background:var(--line);border-radius:3px;position:relative}
.wf .t i{position:absolute;top:0;bottom:0;border-radius:3px}
.funnel{display:grid;gap:6px}
.funnel .st{display:grid;grid-template-columns:170px 1fr 120px;gap:10px;align-items:center;font-size:13px}
.funnel .st .t{height:20px;background:var(--panel2);border-radius:4px;overflow:hidden}
.funnel .st .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.funnel .cv{font-size:11px;color:var(--muted);padding-left:180px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:620px;width:100%;padding:18px 20px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 160px;gap:8px 12px;align-items:center}
.busy{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;z-index:90;display:none}
.busy.on{display:block}
.costin{width:92px;text-align:right}
.costin.need{border-color:var(--na)}
.hl{animation:hl 1.6s ease}
@keyframes hl{0%{box-shadow:0 0 0 3px var(--na)}100%{box-shadow:0 0 0 0 transparent}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:8px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.warnbox{background:var(--warn-bg);border:1px solid rgba(239,165,59,.35);border-radius:8px;padding:9px 12px;font-size:13px}
.errbox{background:var(--bad-bg);border:1px solid rgba(238,91,96,.35);border-radius:8px;padding:9px 12px;font-size:13px}
.nabox{background:var(--na-bg);border:1px solid rgba(179,157,255,.35);border-radius:8px;padding:10px 12px;font-size:13px}
.nabox b{color:var(--na)}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header class="top">
  <h1>Ozon · аналитика продавца</h1>
  <span class="ver" id="ver"></span>
  <div class="grow"></div>
  <div class="period" id="periodBox"></div>
  <button class="primary" id="btnUpload">Загрузить отчёты</button>
  <button id="btnSnap" title="Сохранить текущие ключевые показатели для графика тренда">Сохранить срез</button>
  <button id="btnSettings">Настройки</button>
  <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.csv" hidden>
</header>
<div class="wrap">
  <div id="libError"></div>
  <section id="kpiRow"></section>
  <section id="uploadResults" class="uploadpanel"></section>
  <nav class="tabs" id="tabs"></nav>
  <main id="tabMain"></main>
</div>
<div class="busy" id="busy">Обрабатываю файлы…</div>
<div id="modalRoot"></div>

<script>
'use strict';
/* =====================================================================
   0. ВЕРСИЯ СБОРКИ — обновляйте при каждом деплое, чтобы видеть,
      что открылась свежая, а не закэшированная версия
   ===================================================================== */
const APP_VERSION = '1.0.0';
const BUILD_TIME  = '2026-11-15 01:20';

/* =====================================================================
   1. УТИЛИТЫ: нормализация строк, чисел, дат, форматирование
   ===================================================================== */
const $ = (s, root) => (root ? root : document).querySelector(s);
function esc(s){ return s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Нормализация текста заголовка: неразрывные пробелы, переносы строк, регистр, ё→е
function norm(s){ return s == null ? '' : String(s).replace(/[   \r\n\t]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/ё/g,'е'); }
// Для сопоставления колонок отрезаем хвост с единицами измерения: «Расход, ₽» → «расход»
function normHeader(s){ return norm(s).replace(/\s*,\s*(₽|%|шт\.?|руб\.?|rub)\s*$/i,''); }
function cellStr(v){ return v == null ? '' : String(v).replace(/[ \r\n]+/g,' ').replace(/\s+/g,' ').trim(); }

/* Приведение числа из отчёта к Number.
   Понимает: 1 234,56 / 1 234,56 (неразрывный пробел) / 1234.56 / «0 руб.» / «48%» / «₽».
   Возвращает null (а НЕ 0), если значения нет или его нельзя распознать. */
function parseNum(v){
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v !== 'string') return null;
  let s = v.trim();
  if (!s || /^[-–—]$/.test(s)) return null;
  s = s.replace(/[   \s]/g,'').replace(/руб\.?|₽|rub|р\.|%/gi,'').replace(/^[–—−]/,'-');
  if (/^-?\d+(,\d+)?$/.test(s)) s = s.replace(',', '.');                       // 1234,56
  else if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'').replace(',','.'); // 1.234,56
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,'');     // 1,234.56
  if (!/^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const pad = n => String(n).padStart(2,'0');
function isoFromParts(y,m,d){ y=+y; m=+m; d=+d; if (!(y>1990 && y<2100 && m>=1 && m<=12 && d>=1 && d<=31)) return null; return y+'-'+pad(m)+'-'+pad(d); }
// Серийный номер Excel → ISO-дата (эпоха 1899-12-30)
function excelSerialToISO(n){ if (!(n > 20000 && n < 80000)) return null; return new Date(Math.round((Math.floor(n) - 25569) * 86400000)).toISOString().slice(0,10); }
/* Дата из отчёта: серийный номер Excel, Date, «2026-11-14 20:07:50», «14.11.2026», «14.11.26», «14/11/2026».
   Возвращает 'YYYY-MM-DD' или null. */
function parseDate(v){
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : isoFromParts(v.getFullYear(), v.getMonth()+1, v.getDate());
  if (typeof v === 'number') return excelSerialToISO(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return isoFromParts(m[1],m[2],m[3]);
  m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/); if (m){ let y=+m[3]; if (y<100) y+=2000; return isoFromParts(y,m[2],m[1]); }
  if (/^\d{5}(\.\d+)?$/.test(s)) return excelSerialToISO(+s);
  return null;
}
// SKU Ozon — всегда строка из цифр
function normSku(v){ if (v == null) return null; if (typeof v === 'number') return (isFinite(v) && v >= 0) ? String(Math.round(v)) : null; const s = String(v).trim().replace(/\.0+$/,''); return /^\d+$/.test(s) ? s : null; }
function normStr(v){ if (v == null) return null; const s = String(v).trim(); return s ? s : null; }

function todayISO(){ const d = new Date(); return isoFromParts(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function isoToDate(s){ const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])); }
function addDays(s,n){ const d = isoToDate(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((isoToDate(b) - isoToDate(a)) / 86400000); }
function daysIncl(a,b){ return diffDays(a,b) + 1; }
function fmtDate(s){ if (!s) return '—'; const p = s.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function fmtRange(r){ return r ? fmtDate(r.from) + ' – ' + fmtDate(r.to) : '—'; }
function daysInMonth(ym){ const p = ym.split('-').map(Number); return new Date(Date.UTC(p[0], p[1], 0)).getUTCDate(); }
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function monthLabel(ym){ const p = ym.split('-'); return MONTHS[+p[1]-1] + ' ' + p[0]; }
function overlap(a,b){ if (!a || !b) return null; const from = a.from > b.from ? a.from : b.from, to = a.to < b.to ? a.to : b.to; return from <= to ? {from,to} : null; }
function overlapDays(a,b){ const o = overlap(a,b); return o ? daysIncl(o.from, o.to) : 0; }
function median(arr){ const a = arr.filter(v => v != null && isFinite(v)).sort((x,y)=>x-y); if (!a.length) return null; const m = Math.floor(a.length/2); return a.length % 2 ? a[m] : (a[m-1]+a[m])/2; }

const NF0 = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const NF1 = new Intl.NumberFormat('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});
const NF2 = new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
// Явная плашка «нет данных» с пояснением причины (во всплывающей подсказке)
function na(reason, label){ return '<span class="na" title="'+esc(reason ? reason : 'нет данных')+'">'+(label ? label : 'нет данных')+'</span>'; }
const nz = v => Math.abs(v) < 0.05 ? 0 : v; // убираем «−0» от округления
function rub(v, reason){ return v == null ? na(reason) : NF0.format(nz(v)) + ' ₽'; }
function rubU(v, reason){ return v == null ? na(reason) : (Math.abs(v) < 100 ? NF1 : NF0).format(nz(v)) + ' ₽'; }
function pct(v, reason){ return v == null ? na(reason) : NF1.format(v) + '%'; }
function int(v, reason){ return v == null ? na(reason) : NF0.format(v); }
function dec(v, reason){ return v == null ? na(reason) : NF2.format(v); }
function signCls(v){ return v == null ? '' : v < 0 ? 'bad' : v > 0 ? 'good' : ''; }

/* =====================================================================
   2. ХРАНИЛИЩЕ (localStorage). Привязано к origin: file:// и github.io —
      это РАЗНЫЕ хранилища.
   ===================================================================== */
const LS_PREFIX = 'ozdash1.';
let storageWarned = false;
const LS = {
  get(k, def){ try { const s = localStorage.getItem(LS_PREFIX+k); return s == null ? def : JSON.parse(s); } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(LS_PREFIX+k, JSON.stringify(v)); return true; }
    catch(e){ if (!storageWarned){ storageWarned = true; alert('Не удалось сохранить данные в браузере (localStorage): ' + e.message + '\nВероятно, превышен лимит объёма (~5 МБ). Данные работают в этой вкладке, но после перезагрузки страницы их придётся загрузить снова. Удалите старые отчёты на вкладке «Данные».'); } return false; } },
  del(k){ try { localStorage.removeItem(LS_PREFIX+k); } catch(e){} },
  size(){ let n = 0; try { for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k.startsWith(LS_PREFIX)) n += k.length + localStorage.getItem(k).length; } } catch(e){} return n; }
};
/* Компактная сериализация строк отчёта: повторяющиеся строковые значения — через словарь.
   Финансовый отчёт на 18 000 строк занимает ~1 МБ вместо ~6 МБ. */
function encodeRows(rows){
  const fields = []; const seen = new Set();
  rows.forEach(r => { for (const k in r){ if (!seen.has(k)){ seen.add(k); fields.push(k); } } });
  const dicts = {};
  fields.forEach(f => {
    const vals = new Map(); let onlyStr = true, cnt = 0;
    for (const r of rows){ const v = r[f]; if (v == null) continue; if (typeof v !== 'string'){ onlyStr = false; break; } cnt++; if (!vals.has(v)) vals.set(v, vals.size); }
    if (onlyStr && cnt > 0 && vals.size <= Math.max(64, rows.length/3)) dicts[f] = vals;
  });
  const data = rows.map(r => fields.map(f => { const v = r[f]; if (v == null) return null; return dicts[f] ? dicts[f].get(v) : v; }));
  const d = {}; for (const f in dicts) d[f] = [...dicts[f].keys()];
  return {fields, dicts:d, data};
}
function decodeRows(enc){
  if (!enc || !enc.fields) return [];
  return enc.data.map(a => { const o = {}; enc.fields.forEach((f,i) => { const v = a[i]; o[f] = v == null ? null : (enc.dicts[f] ? enc.dicts[f][v] : v); }); return o; });
}

/* =====================================================================
   4. ЧТЕНИЕ ФАЙЛА
   Важно: Ozon пишет кириллицу в ячейках t="str" как hex-сущности (&#x41F;).
   SheetJS 0.18.5 (последняя версия на cdnjs) обрезает такие символы до младшего байта
   («Период» превращается в «\x1f5@8>4»). Поэтому перед парсингом распаковываем xlsx
   встроенным в SheetJS модулем CFB, заменяем сущности на настоящие символы и пакуем обратно.
   ===================================================================== */
function fixXmlEntities(u8){
  let cfb;
  try { cfb = XLSX.CFB.read(u8, {type:'array'}); } catch(e){ return u8; }
  const dec = new TextDecoder('utf-8'), enc = new TextEncoder();
  let changed = false;
  cfb.FileIndex.forEach((e, i) => {
    const p = cfb.FullPaths[i];
    if (!e || e.type !== 2 || !e.content || !/\.xml$/i.test(p)) return;
    const bytes = e.content instanceof Uint8Array ? e.content : new Uint8Array(e.content);
    const s = dec.decode(bytes);
    if (s.indexOf('&#') < 0) return;
    const t = s.replace(/&#x([0-9a-f]+);/gi, (m,h) => { const c = parseInt(h,16); return c < 0x80 ? m : String.fromCodePoint(c); })
               .replace(/&#(\d+);/g, (m,d) => { const c = parseInt(d,10); return c < 0x80 ? m : String.fromCodePoint(c); });
    if (t !== s){ const nb = enc.encode(t); e.content = nb; e.size = nb.length; changed = true; }
  });
  return changed ? XLSX.CFB.write(cfb, {type:'array', fileType:'zip'}) : u8;
}
async function readWorkbook(file){
  const u8 = new Uint8Array(await file.arrayBuffer());
  if (u8[0] === 0x50 && u8[1] === 0x4B) return XLSX.read(fixXmlEntities(u8), {type:'array'});     // xlsx (zip)
  if (u8[0] === 0xD0 && u8[1] === 0xCF) return XLSX.read(u8, {type:'array'});                     // старый .xls
  // CSV: UTF-8 (с BOM) или windows-1251; числа и коды оставляем строками — разбираем сами
  let text = new TextDecoder('utf-8').decode(u8);
  if (text.indexOf('�') >= 0){ try { text = new TextDecoder('windows-1251').decode(u8); } catch(e){} }
  return XLSX.read(text.replace(/^﻿/, ''), {type:'string', raw:true});
}

/* =====================================================================
   5. ПОИСК СТРОКИ ЗАГОЛОВКА
   - заголовок ищется в первых 40 строках по совпадению с ключевыми словами типа отчёта;
   - проверяется как одна строка, так и пара строк (двухуровневая шапка);
   - объединённые ячейки: значение верхней левой ячейки копируется в пустые ячейки диапазона;
     пустой заголовок второго уровня наследует название группы от ближайшей заполненной ячейки слева.
   ===================================================================== */
function sheetRows(ws){
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true});
  (ws['!merges'] || []).forEach(m => {
    if (m.s.r > 60) return;
    const v = rows[m.s.r] ? rows[m.s.r][m.s.c] : null;
    if (v == null || v === '') return;
    for (let r = m.s.r; r <= m.e.r; r++){ if (!rows[r]) continue; for (let c = m.s.c; c <= m.e.c; c++){ if (rows[r][c] == null || rows[r][c] === '') rows[r][c] = v; } }
  });
  return rows;
}
function combineHeader(top, bottom){
  const n = Math.max(top.length, bottom.length), out = [];
  let lastTop = '';
  for (let c = 0; c < n; c++){
    let t = cellStr(top[c]); const b = cellStr(bottom[c]);
    if (t) lastTop = t; else if (b && lastTop) t = lastTop;     // наследование названия группы слева
    if (!b) out.push(t); else if (!t || t === b) out.push(b); else out.push(t + ' / ' + b);
  }
  return out;
}
function matchColumns(headers, T){
  const normed = headers.map(h => { const full = normHeader(h); const parts = full.split(' / '); return {full, last: normHeader(parts[parts.length-1])}; });
  const used = new Set(), map = {};
  const fields = Object.keys(T.cols).sort((a,b) => (T.cols[b].r ? 1 : 0) - (T.cols[a].r ? 1 : 0));
  for (const f of fields){
    let best = -1, bs = 0;
    normed.forEach((h, i) => {
      if (used.has(i) || !h.full) return;
      for (const kw of T.cols[f].kw){
        let s = 0;
        if (h.full === kw || h.last === kw) s = 3;
        else if (h.full.startsWith(kw) || h.last.startsWith(kw)) s = 2;
        else if (h.full.includes(kw)) s = 1;
        if (s > bs){ bs = s; best = i; }
      }
    });
    if (best >= 0){ map[f] = best; used.add(best); }
  }
  return map;
}
function detectHeader(rows, T){
  let best = null;
  for (let r = 0; r < Math.min(rows.length, 40); r++){
    const row = rows[r] || [];
    const single = row.map(cellStr);
    if (single.filter(Boolean).length < 2) continue;
    const variants = [{headers:single, span:1}];
    if (r + 1 < rows.length) variants.push({headers:combineHeader(row, rows[r+1] || []), span:2});
    for (const v of variants){
      const map = matchColumns(v.headers, T);
      const sc = Object.keys(map).reduce((s,f) => s + (T.cols[f].r ? 2 : 1), 0);
      // при равном счёте предпочитаем однострочный заголовок (двухстрочный — только если он добавляет колонки)
      if (!best || sc > best.score || (sc === best.score && v.span < best.span)) best = {row:r, span:v.span, headers:v.headers, map, score:sc};
    }
  }
  return best && best.score > 0 ? best : null;
}

/* =====================================================================
   6. АВТООПРЕДЕЛЕНИЕ ТИПА ФАЙЛА — по набору колонок и названию листа (не по имени файла)
   Уверенность = доля найденных ключевых колонок типа. Меньше 50% — просим выбрать вручную.
   ===================================================================== */
function analyzeWorkbook(wb){
  const sheets = wb.SheetNames.map(name => ({name, rows: sheetRows(wb.Sheets[name])})).filter(s => s.rows.length);
  const cands = [];
  for (const sh of sheets){
    for (const tid in REPORT_TYPES){
      const T = REPORT_TYPES[tid];
      const h = detectHeader(sh.rows, T); if (!h) continue;
      const det = Object.keys(T.cols).filter(f => T.cols[f].r || T.cols[f].k);
      const matched = det.filter(f => f in h.map).length;
      const ratio = matched / det.length;
      const missingReq = Object.keys(T.cols).filter(f => T.cols[f].r && !(f in h.map)).map(f => T.cols[f].l);
      const reqOk = T.reqCheck ? T.reqCheck(h.map) : missingReq.length === 0;
      const bonus = T.sheetHint && T.sheetHint.test(sh.name) ? 0.05 : 0;
      cands.push({type:tid, sheet:sh.name, rows:sh.rows, header:h, ratio, reqOk, missingReq, score:(reqOk ? 1 : 0) + ratio + bonus});

// Для экрана ручного выбора: самая «заполненная» строка в начале листа как вероятный заголовок
function guessHeaderRow(rows){

/* =====================================================================
   7. ПАРСИНГ СТРОК + ОТЧЁТ О РАСПОЗНАВАНИИ
   ===================================================================== */
function convert(v, t){
  if (t === 'num') return parseNum(v);
  if (t === 'date') return parseDate(v);
  if (t === 'sku') return normSku(v);
  return normStr(v);
}
function scanPeriodText(rows){
  for (let r = 0; r < Math.min(rows.length, 12); r++){
    for (const v of (rows[r] || [])){
      const m = cellStr(v).match(/период[:\s]*(\d{1,2}\.\d{1,2}\.\d{2,4})\s*[-–—]\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i);
      if (m){ const from = parseDate(m[1]), to = parseDate(m[2]); if (from && to) return {from, to}; }
    }
  }
  return null;
}
const MON_SHORT = {'янв':1,'фев':2,'мар':3,'апр':4,'май':5,'мая':5,'июн':6,'июл':7,'авг':8,'сен':9,'окт':10,'ноя':11,'дек':12};

    const m = norm(h).match(/на (\d{1,2}) (янв|фев|мар|апр|мая|май|июн|июл|авг|сен|окт|ноя|дек)/);
    if (m){ const now = new Date(); let y = now.getFullYear(); let iso = isoFromParts(y, MON_SHORT[m[2]], m[1]); if (iso && iso > todayISO()) iso = isoFromParts(y-1, MON_SHORT[m[2]], m[1]); return iso; }
  }
  return null;
}
function buildBatch(file, cand){
  const T = REPORT_TYPES[cand.type];
  const {rows, header} = cand;
  const start = header.row + header.span;
  // колонка себестоимости — ищем в любом отчёте
  let costIdx = -1, costHeader = null;
  if (cand.type !== 'cost') header.headers.forEach((h,i) => { if (costIdx < 0 && COST_RE.test(normHeader(h)) && !Object.values(header.map).includes(i)){ costIdx = i; costHeader = h; } });
  let out = [], skipped = 0;
  for (let i = start; i < rows.length; i++){
    const raw = rows[i];
    if (!raw || raw.every(v => v == null || v === '')) continue;
    const o = {};
    for (const f in header.map) o[f] = convert(raw[header.map[f]], T.cols[f].t);
    if (costIdx >= 0) o.cost = parseNum(raw[costIdx]);
    if (T.valid(o)) out.push(o); else skipped++;
  }
  const parsedCount = out.length;
  if (T.post) out = T.post(out);
  const batch = {
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    type: cand.type, fileName: file.name, sheet: cand.sheet, loadedAt: new Date().toISOString(),
    from: null, to: null, rows: out, meta: {}
  };
  if (T.dated){
    let mn = null, mx = null; out.forEach(r => { const d = r[T.dateField]; if (d){ if (mn == null || d < mn) mn = d; if (mx == null || d > mx) mx = d; } });
    batch.from = mn; batch.to = mx;
  } else if (T.snapshot){
    const preHeaders = []; for (let r = 0; r < start; r++) (rows[r] || []).forEach(v => preHeaders.push(cellStr(v)));
    const d = scanSnapshotDate(preHeaders);
    batch.from = batch.to = d ? d : new Date(file.lastModified).toISOString().slice(0,10);
    batch.meta.snapshotSource = d ? 'из заголовка отчёта' : 'по дате изменения файла';
  } else {
    const p = scanPeriodText(rows); if (p){ batch.from = p.from; batch.to = p.to; }
  }
  // классификация начислений — для прозрачности показываем, куда отнесён каждый тип
  if (cand.type === 'finance'){
    const cls = {};
    out.forEach(r => { const k = r.group + ' → ' + r.type; if (!cls[k]) cls[k] = {group:r.group, type:r.type, item:r.item, sum:0, n:0}; cls[k].sum += r.amount; cls[k].n++; });
    batch.meta.accruals = Object.values(cls).sort((a,b) => Math.abs(b.sum) - Math.abs(a.sum));
  }
  const missingOpt = Object.keys(T.cols).filter(f => !T.cols[f].r && !(f in header.map)).map(f => T.cols[f].l);
  batch.report = {
    typeLabel: T.label, sheet: cand.sheet, headerRow: header.row + 1, headerSpan: header.span,
    confidence: Math.round(cand.ratio * 100), total: parsedCount, finalRows: out.length, skipped,
    missingOpt, matched: Object.keys(header.map).map(f => T.cols[f].l + ' ← «' + header.headers[header.map[f]] + '»'),
    costColumn: cand.type === 'cost' ? header.headers[header.map.cost] : costHeader,
    periodSource: T.dated ? 'по датам в строках' : T.snapshot ? batch.meta.snapshotSource : (batch.from ? 'из строки «Период» в шапке' : 'не найден')
  };

}

/* =====================================================================
   8. ХРАНИЛИЩЕ ДАННЫХ, ОБЪЕДИНЕНИЕ И ЗАМЕНА ПЕРИОДОВ
   «Заменить» — из старых отчётов того же типа удаляются строки за период нового файла.
   «Объединить» — оба набора сохраняются, одинаковые строки (по ключу) берутся из более нового файла.
   ===================================================================== */
const state = {
  batches: [], manualCosts: {}, plans: {}, snapshots: [],
  settings: {taxRate:null, critDays:7, warnDays:14, targetDays:30, drrLow:7, drrHigh:15, minImpr:300},
  period: {preset:'all', from:null, to:null},
  ui: {tab:'overview', sorts:{}, filters:{}, expanded:null, planMonth:null},
  lastResults: [], model: null

let dataVersion = 0; const rowCache = {};
function getRows(type){
  const c = rowCache[type]; if (c && c.v === dataVersion) return c.rows;
  const T = REPORT_TYPES[type], map = new Map();
  state.batches.filter(b => b.type === type).sort((a,b) => a.loadedAt < b.loadedAt ? -1 : 1).forEach(b => {
    const occ = new Map();
    b.rows.forEach(r => { const k = T.key(r); const n = (occ.has(k) ? occ.get(k) : 0) + 1; occ.set(k, n); map.set(k + '#' + n, r); });

}
function coverage(type){
  const bs = state.batches.filter(b => b.type === type && b.from && b.to); if (!bs.length) return null;
  return {from: bs.reduce((m,b) => b.from < m ? b.from : m, bs[0].from), to: bs.reduce((m,b) => b.to > m ? b.to : m, bs[0].to)};
}
function hasType(type){ return state.batches.some(b => b.type === type); }
function latestStockBatch(){ const bs = state.batches.filter(b => b.type === 'stocks'); if (!bs.length) return null; return bs.sort((a,b) => (a.to + a.loadedAt) < (b.to + b.loadedAt) ? 1 : -1)[0]; }

function persistBatches(){

}
function persistAll(){ persistBatches(); LS.set('manualCosts', state.manualCosts); LS.set('plans', state.plans); LS.set('snapshots', state.snapshots); LS.set('settings', state.settings); LS.set('period', state.period); }
function loadState(){
  state.batches = (LS.get('batches', []) || []).map(b => Object.assign(b, {rows: decodeRows(b.rows)}));
  state.manualCosts = LS.get('manualCosts', {});

}
async function commitBatch(batch){
  const T = REPORT_TYPES[batch.type];
  let overlapping = [];
  if (batch.type !== 'cost'){
    overlapping = state.batches.filter(b => b.type === batch.type && (
      (batch.from && b.from && overlap({from:b.from,to:b.to},{from:batch.from,to:batch.to})) || (!batch.from && !b.from)));
  }
  let action = 'add';
  if (overlapping.length){
    action = await askOverlap(batch, overlapping);
    if (action === 'cancel') return {status:'skip', file:batch.fileName, msg:'Загрузка отменена пользователем — данные не изменены.'};
    if (action === 'replace'){
      overlapping.forEach(old => {
        if (T.dated && batch.from){
          old.rows = old.rows.filter(r => { const d = r[T.dateField]; return !(d && d >= batch.from && d <= batch.to); });
          let mn = null, mx = null; old.rows.forEach(r => { const d = r[T.dateField]; if (d){ if (mn == null || d < mn) mn = d; if (mx == null || d > mx) mx = d; } });
          old.from = mn; old.to = mx;
        } else old.rows = [];
      });
      state.batches = state.batches.filter(b => b.rows.length);

/* =====================================================================
   9. СЕБЕСТОИМОСТЬ: ОПРЕДЕЛЕНИЕ ИСТОЧНИКА
   1) колонка себестоимости в любом загруженном отчёте → «из отчёта»
   2) иначе — значение, введённое вручную (localStorage) → «вручную»
   3) иначе — «не заполнено»: прибыль, маржа и ROI товара НЕ считаются
   ===================================================================== */
function reportCostIndex(){

function resolveCost(sku, article, idx){

function costChip(c){ return c.source === 'report' ? '<span class="chip src-report" title="'+esc(c.note)+'">из отчёта</span>' : c.source === 'manual' ? '<span class="chip src-manual">вручную</span>' : '<span class="chip na">не заполнено</span>'; }

/* =====================================================================
   10. ФОРМУЛЫ — ЕДИНСТВЕННЫЙ ИСТОЧНИК ИСТИНЫ
   Все вкладки (KPI, нитка прибыли, юнит-экономика, товары, план-факт, остатки)
   считают только через эти функции. null = «нет данных», а не ноль.
   ===================================================================== */
const F = {
  // сумма известных значений; null, если ни одно значение не известно
  sumKnown(vals){ let s = null; for (const v of vals){ if (v != null) s = (s == null ? v : s + v); } return s; },
  // Выручка − все известные статьи расходов, кроме себестоимости (неизвестные статьи исключаются и показываются в UI)
  contribution(rev, items){ if (rev == null) return null; let s = rev; for (const k of COST_ITEMS){ if (items[k] != null) s -= items[k]; } return s; },
  // Прибыль = Выручка − Себестоимость − Эквайринг − Логистика − Хранение − Реклама − Комиссия − Налоги − Возвраты/штрафы − Прочие
  profit(rev, cogs, items){ const c = F.contribution(rev, items); return (c == null || cogs == null) ? null : c - cogs; },
  margin(profit, rev){ return (profit == null || rev == null || rev <= 0) ? null : profit / rev * 100; },        // Маржа % = Прибыль ÷ Выручка × 100
  roi(profit, cogs){ return (profit == null || cogs == null || cogs <= 0) ? null : profit / cogs * 100; },        // ROI % = Прибыль ÷ Себестоимость × 100
  drr(ads, rev){ return (ads == null || rev == null || rev <= 0) ? null : ads / rev * 100; },                     // ДРР % = Реклама ÷ Выручка × 100
  velocity(units, days){ return (units == null || days == null || days <= 0) ? null : units / days; },           // продаж в день
  daysToZero(stock, vel){ if (stock == null || vel == null) return null; if (vel <= 0) return Infinity; return stock / vel; }, // Остаток ÷ Скорость
  perUnit(v, units){ return (v == null || units == null || units <= 0) ? null : v / units; },
  share(part, total){ return (part == null || total == null || total === 0) ? null : part / total * 100; },
  ratio(a, b){ return (a == null || b == null || b <= 0) ? null : a / b; }
};
// Агрегат по набору товаров (каталог, категория, ABC-группа) — тоже через F
function aggregateSet(list){
  const a = {n: list.length, items: {}};
  a.rev = F.sumKnown(list.map(s => s.rev));
  COST_ITEMS.forEach(k => { a.items[k] = F.sumKnown(list.map(s => s.items[k])); });
  a.units = F.sumKnown(list.map(s => s.netUnits));
  a.contribution = F.contribution(a.rev, a.items);
  const withRev = list.filter(s => s.rev != null && s.rev > 0);
  const covered = list.filter(s => s.profit != null);
  a.nWithRev = withRev.length;
  a.nCovered = covered.filter(s => s.rev != null && s.rev > 0).length;
  a.revCovered = F.sumKnown(covered.map(s => s.rev));
  a.cogsCovered = F.sumKnown(covered.map(s => s.cogs));
  a.profitCovered = covered.length ? F.sumKnown(covered.map(s => s.profit)) : null;
  a.itemsCovered = {}; COST_ITEMS.forEach(k => { a.itemsCovered[k] = F.sumKnown(covered.map(s => s.items[k])); });
  a.coverage = F.share(a.revCovered == null ? 0 : a.revCovered, a.rev);
  a.margin = F.margin(a.profitCovered, a.revCovered);
  a.roi = F.roi(a.profitCovered, a.cogsCovered);
  a.drr = F.drr(a.items.ads, a.rev);
  // доли выручки по источнику себестоимости
  const bySrc = {report:0, manual:0, none:0};
  withRev.forEach(s => { bySrc[s.cost.source] += s.rev; });
  a.costShare = {report: F.share(bySrc.report, a.rev), manual: F.share(bySrc.manual, a.rev), none: F.share(bySrc.none, a.rev)};
  a.full = a.rev != null && a.nWithRev > 0 && a.nCovered === a.nWithRev; // прибыль известна по 100% выручки

// ABC: A — первые 80% суммы, B — следующие 15%, C — остальное и неположительные значения; null — нет данных
function abcClass(list, valFn){
  const res = new Map();
  const vals = list.map(s => [s.sku, valFn(s)]).filter(x => x[1] != null);
  const pos = vals.filter(x => x[1] > 0).sort((a,b) => b[1] - a[1]);
  const tot = pos.reduce((t,x) => t + x[1], 0);
  let cum = 0;
  pos.forEach(([k,v]) => { const before = cum / tot; cum += v; res.set(k, before < 0.8 ? 'A' : before < 0.95 ? 'B' : 'C'); });

  return res;
}

/* =====================================================================
   11. ПОСТРОЕНИЕ МОДЕЛИ ЗА ПЕРИОД (используется всеми вкладками и план-фактом)
   ===================================================================== */
function productIndex(){
  const p = new Map();
  const put = (sku, o) => { if (!sku || sku === '0') return; let e = p.get(sku); if (!e){ e = {sku, name:null, article:null, category:null}; p.set(sku, e); }
    if (o.name && !e.name) e.name = o.name; if (o.article && !e.article) e.article = String(o.article); if (o.category && !e.category) e.category = o.category; };
  getRows('analytics').forEach(r => { const cat = [r.cat3, r.cat2, r.cat1].find(c => c && c !== '–' && c !== '-'); put(r.sku, {name:r.name, article:r.article, category:cat}); });
  getRows('finance').forEach(r => put(r.sku, r));
  getRows('stocks').forEach(r => put(r.sku, r));
  getRows('orders').forEach(r => put(r.sku, r));
  getRows('ads_sku').forEach(r => put(r.sku, r));
  getRows('cost').forEach(r => put(r.sku, r));
  return p;
}
function computeModel(per){
  const ST = state.settings;
  const fin = getRows('finance'), an = getRows('analytics'), ord = getRows('orders'), adsSku = getRows('ads_sku'), camp = getRows('campaigns');
  const cov = {finance: coverage('finance'), analytics: coverage('analytics'), orders: coverage('orders')};
  const finDays = overlapDays(per, cov.finance), anDays = overlapDays(per, cov.analytics), ordDays = overlapDays(per, cov.orders);
  const finOn = finDays > 0, anOn = anDays > 0, ordOn = ordDays > 0;
  const inP = d => d != null && d >= per.from && d <= per.to;
  const prod = productIndex(), costIdx = reportCostIndex();
  const map = new Map();
  const sk = sku => {
    let s = map.get(sku);
    if (!s){ const p = prod.get(sku);
      s = {sku, name: p && p.name ? p.name : 'SKU ' + sku, article: p ? p.article : null, category: p && p.category ? p.category : null,
           fin: null, units: null, returned: null, items: {}, alloc: {}, fun: null, ord: null, stock: null};
      map.set(sku, s); }
    return s;
  };
  prod.forEach((p, sku) => sk(sku));
  const zeroFin = () => { const o = {revenue:0}; FIN_ITEMS.forEach(k => o[k] = 0); o.ads = 0; return o; };

  // --- 11.1 Финансовый отчёт: суммы по статьям, по SKU и нераспределённые (без SKU)
  const found = new Set(fin.map(r => r.item));
  const unattr = zeroFin();
  if (finOn){
    map.forEach(s => { s.fin = zeroFin(); s.units = 0; s.returned = 0; });   // отчёт покрывает период: отсутствие строк = реальный 0
    fin.forEach(r => {
      if (!inP(r.date)) return;
      if (r.sku){
        const s = sk(r.sku); if (!s.fin){ s.fin = zeroFin(); s.units = 0; s.returned = 0; }
        s.fin[r.item] += r.amount;
        const t = norm(r.type);
        if (r.item === 'revenue' && t === 'выручка' && r.qty != null) s.units += Math.abs(r.qty);
        if (r.item === 'returns' && t.includes('возврат выручки') && r.qty != null) s.returned += Math.abs(r.qty);
      } else unattr[r.item] += r.amount;
    });
  }
  const list = [...map.values()];
  list.forEach(s => { s.rev = finOn ? s.fin.revenue : null; s.netUnits = s.units == null ? null : s.units - s.returned; });
  const revTotal = F.sumKnown(list.map(s => s.rev));
  const revShare = s => (revTotal != null && revTotal > 0 && s.rev != null) ? s.rev / revTotal : null;

  // --- 11.2 Статусы статей: найдена ли статья хоть в одном отчёте
  const st = {};
  const finStatus = k => {
    if (!fin.length) return {known:false, reason:'не загружен финансовый отчёт (Отчёт по начислениям)'};
    if (!finOn) return {known:false, reason:'финансовый отчёт загружен за ' + fmtRange(cov.finance) + ' и не пересекается с выбранным периодом'};
    if (!found.has(k)) return {known:false, reason:'в отчёте по начислениям нет ни одной строки этой статьи'};
    return {known:true, source:'Отчёт по начислениям'};
  };
  st.revenue = finStatus('revenue');
  FIN_ITEMS.forEach(k => st[k] = finStatus(k));
  const unallocated = {};
  list.forEach(s => {
    FIN_ITEMS.forEach(k => {
      if (!st[k].known){ s.items[k] = null; return; }
      let v = -(s.fin ? s.fin[k] : 0);
      const u = -unattr[k];
      if (u !== 0){ const sh = revShare(s); if (sh != null){ s.alloc[k] = u * sh; v += u * sh; } }
      s.items[k] = v;
    });

  // --- 11.3 Реклама: факт списаний из начислений, разбивка по SKU — по «Аналитике продвижения»
  const adsBySku = new Map(); let adsSku0 = 0, adsSkuTotal = 0;
  adsSku.forEach(r => { if (r.spend == null) return; if (r.sku === '0') adsSku0 += r.spend; else adsBySku.set(r.sku, (adsBySku.has(r.sku) ? adsBySku.get(r.sku) : 0) + r.spend); adsSkuTotal += r.spend; });
  const adsSkuSum = [...adsBySku.values()].reduce((a,b) => a + b, 0);
  const adsPeriod = coverage('ads_sku'), campPeriod = coverage('campaigns');
  if (finOn && found.has('ads')){
    const total = -unattr.ads + list.reduce((t,s) => t - (s.fin ? s.fin.ads : 0), 0);
    const useShares = adsSkuSum > 0;
    st.ads = {known:true, source:'Отчёт по начислениям; по SKU распределено ' + (useShares ? 'по долям расхода из «Аналитики продвижения»' : 'пропорционально выручке (нет отчёта по рекламе по SKU)')};
    list.forEach(s => { const sh = useShares ? (adsBySku.has(s.sku) ? adsBySku.get(s.sku) / adsSkuSum : 0) : revShare(s); s.items.ads = sh == null ? null : total * sh; s.alloc.ads = s.items.ads; });
    if (!useShares && !(revTotal > 0) && total !== 0) unallocated.ads = total;
  } else if (adsSku.length && adsPeriod && overlapDays(per, adsPeriod) > 0){
    const k = overlapDays(per, adsPeriod) / daysIncl(adsPeriod.from, adsPeriod.to);
    st.ads = {known:true, source:'Аналитика продвижения за ' + fmtRange(adsPeriod) + (k < 1 ? ', пересчитано пропорционально дням выбранного периода (' + NF0.format(k*100) + '%)' : '')};
    list.forEach(s => { let v = (adsBySku.has(s.sku) ? adsBySku.get(s.sku) : 0) * k; const sh = revShare(s); if (adsSku0 && sh != null) v += adsSku0 * k * sh; s.items.ads = v; });
  } else if (camp.length && campPeriod && overlapDays(per, campPeriod) > 0){
    const k = overlapDays(per, campPeriod) / daysIncl(campPeriod.from, campPeriod.to);
    const total = camp.reduce((t,r) => t + (r.spend == null ? 0 : r.spend), 0) * k;
    st.ads = {known:true, source:'Статистика кампаний за ' + fmtRange(campPeriod) + ', распределено пропорционально выручке'};
    list.forEach(s => { const sh = revShare(s); s.items.ads = sh == null ? null : total * sh; });
  } else {
    st.ads = {known:false, reason: (adsSku.length || camp.length) ? 'рекламные отчёты не пересекаются с выбранным периодом' : 'нет рекламных строк в отчёте по начислениям и не загружены отчёты по рекламе'};
    list.forEach(s => { s.items.ads = null; });
  }

  // --- 11.4 Налоги: в отчётах Ozon их нет — только ставка из настроек
  st.tax = ST.taxRate == null ? {known:false, reason:'ставка налога не задана в «Настройках» (в отчётах Ozon налога нет)'} : {known:true, source:'ставка ' + NF1.format(ST.taxRate) + '% от выручки из настроек'};
  list.forEach(s => { s.items.tax = (st.tax.known && s.rev != null) ? s.rev * ST.taxRate / 100 : null; });

  // --- 11.5 Себестоимость и итоговые метрики по SKU — только через F
  list.forEach(s => {
    s.cost = resolveCost(s.sku, s.article, costIdx);
    s.cogs = (s.cost.value == null || s.netUnits == null) ? null : s.cost.value * Math.max(s.netUnits, 0);
    s.contribution = F.contribution(s.rev, s.items);
    s.profit = F.profit(s.rev, s.cogs, s.items);
    s.profitReason = s.rev == null ? st.revenue.reason : s.cost.value == null ? 'нет данных о себестоимости — введите её на вкладке «Юнит-экономика»' : null;
    s.margin = F.margin(s.profit, s.rev);
    s.roi = F.roi(s.profit, s.cogs);
    s.drr = F.drr(s.items.ads, s.rev);
    s.price = F.perUnit(s.rev, s.netUnits);
    s.pu = {cogs: s.cost.value != null && s.netUnits > 0 ? s.cost.value : null};
    COST_ITEMS.forEach(k => { s.pu[k] = F.perUnit(s.items[k], s.netUnits); });
    s.ppu = F.perUnit(s.profit, s.netUnits);
    s.revShare = F.share(s.rev, revTotal);
  });

  // --- 11.6 Воронка (аналитика по дням)
  if (anOn){
    list.forEach(s => { s.fun = {impr:0, views:0, carts:0, ordered:0, orderedSum:0}; });
    an.forEach(r => {
      if (!inP(r.day)) return;
      const s = sk(r.sku); if (!s.fun) s.fun = {impr:0, views:0, carts:0, ordered:0, orderedSum:0};
      if (r.impressions != null) s.fun.impr += r.impressions;
      if (r.cardViews != null) s.fun.views += r.cardViews;
      if (r.carts != null) s.fun.carts += r.carts;
      if (r.ordered != null) s.fun.ordered += r.ordered;
      if (r.orderedSum != null) s.fun.orderedSum += r.orderedSum;
    });
  }
  // --- 11.7 Заказы: заказано / отменено / доставлено, процент выкупа
  if (ordOn){
    list.forEach(s => { s.ord = {ordered:0, cancelled:0, delivered:0, inProgress:0}; });
    ord.forEach(r => {
      if (!inP(r.accepted) || r.qty == null) return;
      const s = sk(r.sku); if (!s.ord) s.ord = {ordered:0, cancelled:0, delivered:0, inProgress:0};
      const stt = norm(r.status);
      s.ord.ordered += r.qty;
      if (stt.startsWith('отмен')) s.ord.cancelled += r.qty; else if (stt === 'доставлен') s.ord.delivered += r.qty; else s.ord.inProgress += r.qty;
    });
  }
  list.forEach(s => { s.buyout = s.ord ? F.share(s.ord.delivered, s.ord.delivered + s.ord.cancelled) : null; });

  // --- 11.8 Остатки и скорость продаж
  const sb = latestStockBatch();
  const stockMap = new Map(); if (sb) sb.rows.forEach(r => stockMap.set(r.sku, r));
  list.forEach(s => {
    const r = stockMap.get(s.sku);
    s.stock = sb ? (r ? {available: r.available, inTransit: F.sumKnown([r.inSupply, r.inTransit]), ozonVelocity: r.ozonVelocity, ozonDays: r.ozonDays, date: sb.to}
                      : {available: 0, inTransit: null, ozonVelocity: null, ozonDays: null, date: sb.to, absent: true}) : null;
    // скорость продаж: заказы (без отмен) → продажи из начислений → оценка Ozon за 28 дней
    if (ordOn && s.ord){ s.velocity = F.velocity(s.ord.ordered - s.ord.cancelled, ordDays); s.velSrc = 'заказы без отмен за ' + ordDays + ' дн.'; }
    else if (finOn && s.netUnits != null){ s.velocity = F.velocity(s.netUnits, finDays); s.velSrc = 'продажи из начислений за ' + finDays + ' дн.'; }
    else if (s.stock && s.stock.ozonVelocity != null){ s.velocity = s.stock.ozonVelocity; s.velSrc = 'оценка Ozon (среднее за 28 дней)'; }
    else { s.velocity = null; s.velSrc = 'нет данных о продажах за период'; }
    s.daysLeft = F.daysToZero(s.stock ? s.stock.available : null, s.velocity);
    s.zeroDate = (s.daysLeft != null && isFinite(s.daysLeft) && s.stock) ? addDays(s.stock.date, Math.floor(s.daysLeft)) : null;
    s.stockStatus = s.daysLeft == null ? null : s.daysLeft === Infinity ? 'nosales' : s.daysLeft < ST.critDays ? 'crit' : s.daysLeft < ST.warnDays ? 'warn' : 'ok';
  });

  // --- 11.9 ABC отдельно по прибыли и по выручке
  const abcP = abcClass(list, s => s.profit), abcR = abcClass(list, s => s.rev);
  list.forEach(s => { s.abcProfit = abcP.has(s.sku) ? abcP.get(s.sku) : null; s.abcRevenue = abcR.has(s.sku) ? abcR.get(s.sku) : null; s.advice = supplyAdvice(s, ST); });

  // --- 11.10 Категории
  const cats = new Map();
  list.forEach(s => { const c = s.category ? s.category : 'Без категории'; if (!cats.has(c)) cats.set(c, []); cats.get(c).push(s); });
  const catAgg = [...cats.entries()].map(([name, l]) => Object.assign(aggregateSet(l), {name}));

  const relevant = list.filter(s => (s.rev != null && s.rev !== 0) || (s.netUnits != null && s.netUnits !== 0) || (s.stock && !s.stock.absent) || (s.fun && s.fun.impr > 0) || (s.ord && s.ord.ordered > 0) || s.cost.source !== 'none');
  const m = {per, list: relevant, all: aggregateSet(relevant), cats: catAgg, st, cov, finOn, anOn, ordOn, finDays, anDays, ordDays, unallocated, stockBatch: sb,
             adsSku, camp, adsDaily: getRows('ads_daily').filter(r => inP(r.date)).sort((a,b) => a.date < b.date ? -1 : 1)};
  m.growth = findGrowthPoints(m);
  m.attention = relevant.filter(s => s.stockStatus === 'crit' || (s.profit != null && s.profit < 0)).length;
  m.excluded = ['cogs'].concat(COST_ITEMS).filter(k => k === 'cogs' ? m.all.costShare.none > 0 : !st[k].known);
  return m;
}

/* Рекомендация по поставке (простое правило, если нет данных для более точной) */
function supplyAdvice(s, ST){
  if (!s.stock) return {t:'нет отчёта по остаткам', cls:'na'};
  if (s.velocity == null) return {t:'нет данных о продажах за период', cls:'na'};
  if (s.daysLeft === Infinity) return {t:'продаж нет — поставка не нужна', cls:''};
  const grp = s.abcProfit != null ? s.abcProfit : s.abcRevenue;
  const grpNote = s.abcProfit != null ? '' : ' (группа по выручке — прибыль неизвестна)';
  if (s.daysLeft < ST.warnDays){
    if (grp === 'C') return {t:'остаток заканчивается, но товар в группе C' + grpNote + ' — проверьте, стоит ли поставлять', cls:'warn'};
    // если колонок «в пути» в отчёте нет — не считаем, что в пути 0, а явно говорим об этом
    const trKnown = s.stock.inTransit != null;
    const qty = Math.ceil(s.velocity * ST.targetDays - s.stock.available - (trKnown ? s.stock.inTransit : 0));
    const trNote = trKnown ? '' : ' (без учёта товара в пути — нет данных в отчёте по остаткам)';
    return qty > 0 ? {t:'пора поставлять: ~' + NF0.format(qty) + ' шт. на ' + ST.targetDays + ' дн.' + trNote + grpNote, cls:'bad'} : {t:'заканчивается, но товара в пути достаточно', cls:'warn'};
  }
  return {t:'в норме', cls:'good'};
}

/* =====================================================================
   12. ВОРОНКА И ТОЧКИ РОСТА — метод отклонения от медианы каталога
   Потенциал = недополученные продажи (по медианной конверсии) × прибыль на единицу.
   Это ориентир для приоритизации, а не прогноз.
   ===================================================================== */
function findGrowthPoints(m){
  const ST = state.settings, out = [];
  if (!m.anOn) return {points: out, med: null};
  const pool = m.list.filter(s => s.fun && s.fun.impr >= ST.minImpr);
  const conv = s => F.ratio(s.fun.carts, s.fun.impr), co = s => F.ratio(s.fun.ordered, s.fun.carts), io = s => F.ratio(s.fun.ordered, s.fun.impr);
  const med = {conv: median(pool.map(conv)), impr: median(pool.map(s => s.fun.impr)), co: median(pool.filter(s => s.fun.carts >= 5).map(co)),
               buyout: median(pool.map(s => s.buyout)), margin: median(m.list.map(s => s.margin))};
  const goodMargin = s => s.margin != null && s.margin > 0 && (med.margin == null || s.margin >= med.margin * 0.8);
  const bo = s => (s.buyout != null ? s.buyout : med.buyout != null ? med.buyout : 100) / 100;
  const add = (s, kind, label, detail, units) => {
    const ppu = s.ppu;
    out.push({s, kind, label, detail, units, potential: (ppu != null && ppu > 0 && units != null) ? units * ppu : null,
      why: ppu == null ? 'нет себестоимости — прибыль на единицу неизвестна' : ppu <= 0 ? 'единица товара убыточна — рост продаж не даст прибыли' : null, marginKnown: s.margin != null});
  };
  pool.forEach(s => {
    const c = conv(s);
    if (med.conv != null && c != null && c < med.conv * 0.7 && (s.margin == null || goodMargin(s)))
      add(s, 'weak', 'Слабая карточка', 'показ→корзина ' + NF2.format(c*100) + '% при медиане ' + NF2.format(med.conv*100) + '%', (co(s) != null ? co(s) : med.co) == null ? null : s.fun.impr * (med.conv - c) * (co(s) != null ? co(s) : med.co) * bo(s));
    if (med.impr != null && s.fun.impr < med.impr * 0.5 && goodMargin(s))
      add(s, 'traffic', 'Мало продвижения', 'показов ' + NF0.format(s.fun.impr) + ' при медиане ' + NF0.format(med.impr), io(s) == null ? null : (med.impr - s.fun.impr) * io(s) * bo(s));
    const o = co(s);
    if (med.co != null && s.fun.carts >= 10 && o != null && o < med.co * 0.8)
      add(s, 'cart', 'Брошенные корзины', 'корзина→заказ ' + NF1.format(o*100) + '% при медиане ' + NF1.format(med.co*100) + '%', s.fun.carts * (med.co - o) * bo(s));
    if (med.buyout != null && s.buyout != null && s.ord && (s.ord.delivered + s.ord.cancelled) >= 10 && s.buyout < med.buyout - 5)
      add(s, 'buyout', 'Низкий выкуп', 'выкуп ' + NF1.format(s.buyout) + '% при медиане ' + NF1.format(med.buyout) + '%', (s.ord.delivered + s.ord.cancelled) * (med.buyout - s.buyout) / 100);
  });
  out.sort((a,b) => (b.potential == null ? -1 : b.potential) - (a.potential == null ? -1 : a.potential));
  return {points: out, med, poolSize: pool.length};
}

/* =====================================================================
   13. АВТОВЫВОДЫ (готовые фразы по выбранному периоду)
   ===================================================================== */
function buildInsights(m){
  const ST = state.settings, A = m.all, out = [];
  if (!m.finOn) out.push({cls:'na', t:'<b>Прибыль, маржа и ДРР не рассчитаны:</b> ' + esc(m.st.revenue.reason) + '.'});
  if (A.costShare.none > 0) out.push({cls:'na', t:'Себестоимость неизвестна по <b>' + (A.nWithRev - A.nCovered) + '</b> товарам с продажами (' + NF0.format(A.costShare.none) + '% выручки) — по ним прибыль не считается. <a href="#" data-goto="unit">Ввести себестоимость →</a>'});
  const losers = m.list.filter(s => s.profit != null && s.profit < 0);
  if (A.nCovered > 0) out.push(losers.length ? {cls:'bad', t:'<b>' + losers.length + '</b> ' + plural(losers.length,'товар продаётся','товара продаются','товаров продаются') + ' в убыток на общую сумму <b>' + rub(Math.abs(losers.reduce((t,s) => t + s.profit, 0))) + '</b>.'}
                                         : {cls:'good', t:'Убыточных товаров нет среди ' + A.nCovered + ' товаров с известной себестоимостью.'});
  const cm = m.cats.filter(c => c.margin != null);
  if (m.cats.length < 2) out.push({cls:'', t:'Все товары в одной категории' + (m.cats[0] ? ' «' + esc(m.cats[0].name) + '»' : '') + ' — сравнение маржи между категориями недоступно.'});
  else if (cm.length >= 2){ cm.sort((a,b) => b.margin - a.margin); out.push({cls:'', t:'Лучшая маржа — у категории «' + esc(cm[0].name) + '» (' + pct(cm[0].margin) + '), худшая — у «' + esc(cm[cm.length-1].name) + '» (' + pct(cm[cm.length-1].margin) + ').'}); }
  else out.push({cls:'na', t:'Сравнить маржу категорий нельзя: маржа известна меньше чем по двум категориям (не хватает себестоимости).'});
  if (m.stockBatch){ const soon = m.list.filter(s => s.daysLeft != null && s.daysLeft < ST.warnDays); out.push({cls: soon.length ? 'warn' : 'good', t: soon.length ? '<b>' + soon.length + '</b> ' + plural(soon.length,'товар закончится','товара закончатся','товаров закончатся') + ' меньше чем через ' + ST.warnDays + ' дн. (из них критично, менее ' + ST.critDays + ' дн.: <b>' + soon.filter(s => s.daysLeft < ST.critDays).length + '</b>).' : 'Нет товаров, которые закончатся в ближайшие ' + ST.warnDays + ' дн.'}); }
  else out.push({cls:'na', t:'Прогноз обнуления остатков недоступен: не загружен отчёт по остаткам.'});
  if (A.drr != null){ const d = A.drr; out.push({cls: d > ST.drrHigh ? 'bad' : d < ST.drrLow ? 'good' : '', t:'ДРР каталога <b>' + pct(d) + '</b> — ' + (d > ST.drrHigh ? 'выше ориентира ' + ST.drrLow + '–' + ST.drrHigh + '%: реклама съедает заметную часть выручки, проверьте кампании с высоким ДРР.' : d < ST.drrLow ? 'ниже ориентира ' + ST.drrLow + '–' + ST.drrHigh + '%: есть запас, чтобы усилить продвижение прибыльных товаров.' : 'в пределах ориентира ' + ST.drrLow + '–' + ST.drrHigh + '%.')}); }
  else out.push({cls:'na', t:'ДРР не рассчитан: ' + esc(m.st.ads.known ? m.st.revenue.reason : m.st.ads.reason) + '.'});
  const g = m.growth.points;
  if (!m.anOn) out.push({cls:'na', t:'Точки роста в воронке не искались: не загружен отчёт аналитики по дням за выбранный период.'});
  else {
    const pot = F.sumKnown(g.map(p => p.potential)), noEst = g.filter(p => p.potential == null).length;
    out.push({cls: g.length ? 'warn' : 'good', t:'Найдено <b>' + g.length + '</b> ' + plural(g.length,'точка','точки','точек') + ' роста в воронке' +
      (!g.length ? '.' : pot == null
        ? '. Оценить потенциал в рублях нельзя ни по одному сигналу: у этих товаров нет себестоимости или единица убыточна. <a href="#" data-goto="ads">Подробнее →</a>'
        : ', потенциал ≈ <b>' + rub(pot) + '</b> прибыли за период (ориентир)' + (noEst ? '; ещё по ' + noEst + ' ' + plural(noEst,'сигналу','сигналам','сигналам') + ' оценить нельзя (нет себестоимости или единица убыточна)' : '') + '. <a href="#" data-goto="ads">Подробнее →</a>')});
  }
  const cand = m.list.filter(s => s.abcRevenue === 'C' && s.profit != null && s.profit < 0);
  out.push({cls: cand.length ? 'bad' : '', t: A.nCovered ? (cand.length ? '<b>' + cand.length + '</b> ' + plural(cand.length,'товар','товара','товаров') + ' одновременно в группе C по выручке и убыточны — кандидаты на вывод из ассортимента: ' + cand.slice(0,5).map(s => esc(shortName(s))).join(', ') + '.' : 'Нет товаров, которые одновременно в группе C по выручке и убыточны.') : 'Кандидатов на вывод из ассортимента определить нельзя: нет себестоимости.'});
  return out;
}
function plural(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; }
function shortName(s){ const n = s.name ? s.name : 'SKU ' + s.sku; return n.length > 60 ? n.slice(0,57) + '…' : n; }

/* =====================================================================
   14. ПЛАН-ФАКТ с учётом темпа
   ===================================================================== */
function planFact(ym){
  const plan = state.plans[ym] ? state.plans[ym] : {};
  const mStart = ym + '-01', mEnd = ym + '-' + pad(daysInMonth(ym)), dim = daysInMonth(ym);
  const res = {ym, plan, mStart, mEnd, dim};
  const fc = coverage('finance');
  if (!fc){ res.status = 'nofin'; return res; }
  const ov = overlap({from:mStart, to:mEnd}, fc);
  if (!ov){ res.status = 'nooverlap'; res.fc = fc; return res; }
  const today = todayISO();
  const ref = ov.to < today ? ov.to : (today < ov.from ? ov.to : today);
  res.ref = ref; res.partialStart = ov.from > mStart; res.dataFrom = ov.from;
  res.m = computeModel({from: mStart, to: ref});
  res.refDay = +ref.slice(8,10);
  res.expected = res.refDay / dim * 100;
  res.daysLeft = dim - res.refDay;
  res.lagging = ref < today && ref < mEnd; // данные отстают от сегодняшнего дня
  res.status = 'ok';
  return res;
}
function paceStatus(factPct, expected){
  if (factPct == null) return {t:'нет факта', cls:'na'};
  if (factPct >= 100) return {t:'план выполнен', cls:'good'};
  const r = expected > 0 ? factPct / expected : 1;
  return r >= 0.95 ? {t:'идёт по графику', cls:'good'} : r >= 0.8 ? {t:'немного отстаёт', cls:'warn'} : {t:'сильно отстаёт', cls:'bad'};
}

/* =====================================================================
   15. ПЕРИОД
   ===================================================================== */
function dataRange(){
  const rs = ['finance','analytics','orders'].map(coverage).filter(Boolean);
  if (!rs.length) return null;
  return {from: rs.reduce((m,r) => r.from < m ? r.from : m, rs[0].from), to: rs.reduce((m,r) => r.to > m ? r.to : m, rs[0].to)};
}
function resolvePeriod(){
  const dr = dataRange(), p = state.period;
  if (!dr) return {from: '2000-01-01', to: '2000-01-01', empty: true, label: 'нет данных'};
  let from = dr.from, to = dr.to;
  if (p.preset === 'last7') from = addDays(to, -6);
  else if (p.preset === 'last14') from = addDays(to, -13);
  else if (p.preset === 'last30') from = addDays(to, -29);
  else if (p.preset && p.preset.startsWith('m:')){ const ym = p.preset.slice(2); from = ym + '-01'; to = ym + '-' + pad(daysInMonth(ym)); }
  else if (p.preset === 'custom' && p.from && p.to){ from = p.from; to = p.to; }
  if (from < dr.from && p.preset !== 'custom') from = dr.from;
  return {from, to, days: daysIncl(from, to), label: fmtRange({from, to})};
}

/* ---------- Универсальная таблица с сортировкой ---------- */
function sortRows(id, rows, cols, defKey, defDir){
  const s = state.ui.sorts[id] ? state.ui.sorts[id] : {k: defKey, d: defDir ? defDir : -1};
  const col = cols.find(c => c.k === s.k);
  if (col && col.v) rows.sort((a,b) => { let x = col.v(a), y = col.v(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    if (typeof x === 'string') return s.d * x.localeCompare(y, 'ru'); return s.d * (x - y); });
  return s;
}
function tableHtml(id, cols, rows, opt){
  opt = opt ? opt : {};

  if (!rows.length) h += '<tr><td colspan="' + cols.length + '" class="muted" style="text-align:center;padding:18px">' + (opt.emptyText ? opt.emptyText : 'Нет строк') + '</td></tr>';

function waterfallSteps(A, covered){
  const items = covered ? A.itemsCovered : A.items, rev = covered ? A.revCovered : A.rev;
  const steps = [{l:'Выручка', v:rev, kind:'total'}];
  if (covered) steps.push({l:'Себестоимость', v:-A.cogsCovered});
  COST_ITEMS.forEach(k => { if (items[k] != null && Math.abs(items[k]) >= 0.5) steps.push({l:ITEM_LABELS[k], v:-items[k]}); });
  const end = covered ? A.profitCovered : F.contribution(rev, items);
  steps.push({l: covered ? 'Чистая прибыль' : 'Результат до себестоимости', v:end, kind:'total'});
  return steps;
}
function drawWaterfall(m){
  const A = m.all, covered = A.nCovered > 0;
  const steps = waterfallSteps(A, covered);
  let run = 0; const data = [], colors = [];
  steps.forEach(s => {
    if (s.kind === 'total'){ data.push([0, s.v]); colors.push(s.v >= 0 ? (s.l === 'Выручка' ? '#5b8cff' : '#36c47c') : '#ee5b60'); run = s.v; }
    else { data.push([run, run + s.v]); colors.push(s.v < 0 ? '#ee5b60' : '#36c47c'); run += s.v; }
  });
  mkChart('chWf', {type:'bar', data:{labels: steps.map(s => s.l), datasets:[{data, backgroundColor: colors, borderRadius:3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label: c => { const s = steps[c.dataIndex]; return s.l + ': ' + NF0.format(s.v) + ' ₽' + (s.kind ? '' : ' (' + NF1.format(Math.abs(s.v) / (steps[0].v ? steps[0].v : 1) * 100) + '% выручки)'); }}}},
      scales:{x:{ticks:{maxRotation:50, minRotation:30, font:{size:11}}}, y:{ticks:{callback: v => NF0.format(v/1000) + 'k'}}}}});
  const n = $('#wfNote');
  if (n) n.innerHTML = covered ? (m.excluded.filter(k => k !== 'cogs').length ? 'Не учтены (нет в отчётах): ' + m.excluded.filter(k => k !== 'cogs').map(k => ITEM_LABELS[k]).join(', ') + '.' : 'Все статьи формулы найдены в отчётах.') + ' Расходы без SKU (реклама, кросс-докинг, подписки) распределены по товарам.'
                          : '<span class="na">Себестоимость не заполнена</span> — график заканчивается результатом до себестоимости по всему каталогу, это ещё не чистая прибыль.';
}

    {k:'drr', l:'ДРР', num:1, v:c => c.drr, h:c => pct(c.drr, m.st.ads.reason)}

  return tableHtml('cats', cols, m.cats.slice(), {defKey:'rev'}) + (m.anOn || hasType('analytics') ? '' : '<div class="note"><span class="na">Категорий нет</span> — они берутся из отчёта аналитики по дням (колонка «Категория 3 уровня»).</div>');
}
function topList(m, dir){
  const l = m.list.filter(s => s.profit != null).sort((a,b) => dir * (b.profit - a.profit)).slice(0,5);
  if (!l.length) return '<div class="nabox"><b>Нет данных:</b> нет товаров с известной себестоимостью и прибылью.</div>';
  return '<table><tbody>' + l.map((s,i) => '<tr><td class="dim">' + (i+1) + '</td><td>' + nameCell(s) + '</td><td class="num ' + signCls(s.profit) + '">' + rub(s.profit) + '<div class="sub">маржа ' + pct(s.margin) + '</div></td></tr>').join('') + '</tbody></table>';

/* ---------- Вкладка «План-факт» ---------- */
function renderPlan(el){
  const ym = state.ui.planMonth ? state.ui.planMonth : (state.ui.planMonth = todayISO().slice(0,7));
  const pf = planFact(ym), plan = pf.plan;
  let h = '<div class="card"><h3>План на месяц</h3><div class="filters">Месяц: <input type="month" id="planMonth" value="' + ym + '">' +
    ' Плановая выручка, ₽: <input type="number" id="planRev" min="0" step="1000" value="' + (plan.revenue != null ? plan.revenue : '') + '" style="width:150px">' +
    ' Плановая прибыль, ₽: <input type="number" id="planProfit" step="1000" value="' + (plan.profit != null ? plan.profit : '') + '" style="width:150px">' +
    ' <span class="dim small">сохраняется в браузере автоматически</span></div></div>';
  if (pf.status === 'nofin') h += '<div class="nabox" style="margin-top:14px"><b>Факт недоступен:</b> не загружен финансовый отчёт (Отчёт по начислениям). План сохранён, прогресс появится после загрузки.</div>';
  else if (pf.status === 'nooverlap') h += '<div class="nabox" style="margin-top:14px"><b>План задан на ' + monthLabel(ym) + ', а финансовые данные загружены за ' + fmtRange(pf.fc) + '.</b> Факт за этот месяц посчитать нельзя — это не нулевой прогресс, а отсутствие данных. Загрузите «Отчёт по начислениям» за ' + monthLabel(ym) + ' или выберите другой месяц.</div>';
  if (pf.status === 'ok'){
    const A = pf.m.all;
    const avgPrice = F.perUnit(A.rev, A.units);
    const planUnits = plan.revenue != null && avgPrice != null ? plan.revenue / avgPrice : null;
    h += '<div class="card" style="margin-top:14px"><h3>Выполнение плана <small>факт с ' + fmtDate(pf.mStart) + ' по ' + fmtDate(pf.ref) + ' · прошло ' + pf.refDay + ' из ' + pf.dim + ' дн. → ожидается ' + NF0.format(pf.expected) + '% выполнения</small></h3>' +
      (pf.partialStart ? '<div class="warnbox" style="margin-bottom:10px">Финансовые данные за этот месяц начинаются только с ' + fmtDate(pf.dataFrom) + ' — факт неполный, загрузите отчёт с начала месяца.</div>' : '') +
      (pf.lagging ? '<div class="warnbox" style="margin-bottom:10px">Данные загружены по ' + fmtDate(pf.ref) + ', сегодня ' + fmtDate(todayISO()) + '. Темп оценивается на дату последних данных.</div>' : '') +
      progressRow('Выручка', A.rev, plan.revenue, pf.expected, rub) +
      progressRow('Прибыль' + (A.nCovered && !A.full ? ' <span class="dim small">(по ' + NF0.format(A.coverage) + '% выручки с известной себестоимостью)</span>' : ''), A.profitCovered, plan.profit, pf.expected, rub, A.nCovered ? null : 'нет себестоимости — факт прибыли неизвестен') +
      progressRow('Количество продаж <span class="dim small">(план = план выручки ÷ средняя цена по факту ' + rubU(avgPrice, 'нет продаж') + ')</span>', A.units, planUnits, pf.expected, v => int(v) + ' шт.', avgPrice == null ? 'нет продаж — средняя цена неизвестна' : null) +
      '</div>';
    // нужный темп
    if (plan.revenue != null){
      const curPerDay = A.rev == null ? null : A.rev / pf.refDay;
      const need = A.rev == null ? null : (pf.daysLeft > 0 ? Math.max(plan.revenue - A.rev, 0) / pf.daysLeft : null);
      const ratio = curPerDay && need != null ? need / curPerDay : null;
      h += '<div class="card" style="margin-top:14px"><h3>Нужный темп по выручке</h3><div class="statgrid">' +
        '<div class="stat"><div class="l">Текущая выручка в день</div><div class="v">' + rub(curPerDay, 'нет факта') + '</div></div>' +
        '<div class="stat"><div class="l">Нужно в день до конца месяца</div><div class="v">' + (pf.daysLeft > 0 ? rub(need, 'нет факта') : '<span class="muted">месяц завершён</span>') + '</div><div class="small muted">осталось ' + pf.daysLeft + ' дн.</div></div>' +
        '<div class="stat"><div class="l">Сравнение</div><div class="v ' + (ratio == null ? '' : ratio <= 1 ? 'good' : ratio <= 1.2 ? 'warn' : 'bad') + '">' + (ratio == null ? (A.rev != null && A.rev >= plan.revenue ? '<span class="good">план выполнен</span>' : na('нет данных')) : ratio <= 1 ? 'темпа хватает' : '+' + NF0.format((ratio - 1) * 100) + '% к темпу') + '</div></div></div></div>';
    }
    // по категориям
    const cats = pf.m.cats;
    h += '<div class="card" style="margin-top:14px"><h3>План по категориям <small>необязательно</small></h3><div class="tblwrap"><table><thead><tr><th>Категория</th><th class="num">План выручки</th><th class="num">Факт выручки</th><th>Прогресс</th><th class="num">План прибыли</th><th class="num">Факт прибыли</th><th>Прогресс</th></tr></thead><tbody>' +
      cats.map(c => { const cp = plan.cats && plan.cats[c.name] ? plan.cats[c.name] : {};
        return '<tr><td>' + esc(c.name) + '</td><td class="num"><input type="number" data-catplan="' + esc(c.name) + ':revenue" value="' + (cp.revenue != null ? cp.revenue : '') + '" style="width:120px"></td><td class="num">' + rub(c.rev) + '</td><td style="min-width:200px">' + miniProgress(c.rev, cp.revenue, pf.expected) + '</td>' +
          '<td class="num"><input type="number" data-catplan="' + esc(c.name) + ':profit" value="' + (cp.profit != null ? cp.profit : '') + '" style="width:120px"></td><td class="num">' + rub(c.profitCovered, 'нет себестоимости') + '</td><td style="min-width:200px">' + miniProgress(c.profitCovered, cp.profit, pf.expected) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  }
  el.innerHTML = h;
  const save = () => { const p = state.plans[ym] ? state.plans[ym] : (state.plans[ym] = {}); p.revenue = parseNum($('#planRev').value); p.profit = parseNum($('#planProfit').value); LS.set('plans', state.plans); renderActive(); };
  $('#planRev').onchange = save; $('#planProfit').onchange = save;
  $('#planMonth').onchange = e => { if (e.target.value){ state.ui.planMonth = e.target.value; renderActive(); } };
  el.querySelectorAll('[data-catplan]').forEach(inp => inp.onchange = () => { const [cat, f] = inp.dataset.catplan.split(/:(?=[^:]+$)/); const p = state.plans[ym] ? state.plans[ym] : (state.plans[ym] = {}); if (!p.cats) p.cats = {}; if (!p.cats[cat]) p.cats[cat] = {}; p.cats[cat][f] = parseNum(inp.value); LS.set('plans', state.plans); renderActive(); });
}
function progressRow(label, fact, plan, expected, fmt, naReason){
  if (plan == null) return '<div style="margin:14px 0"><b>' + label + '</b>: <span class="muted">план не задан</span></div>';
  const fp = fact == null ? null : F.share(fact, plan);
  const ps = paceStatus(fp, expected);
  const w = fp == null ? 0 : Math.max(0, Math.min(fp, 100));
  return '<div style="margin:16px 0 18px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b>' + label + '</b></span><span>' + (fact == null ? na(naReason ? naReason : 'нет факта') : fmt(fact)) + ' из ' + fmt(plan) + ' · ' + (fp == null ? '' : '<b>' + NF0.format(fp) + '%</b> ') + '<span class="chip ' + ps.cls + '">' + ps.t + '</span></span></div>' +
    '<div class="bar' + (fact == null ? ' nofact' : '') + '"><div class="fill" style="width:' + w + '%;background:var(--' + (ps.cls === 'na' ? 'na' : ps.cls) + ')"></div><div class="mark" style="left:' + Math.min(expected, 100) + '%" data-l="ожид. ' + NF0.format(expected) + '%"></div></div></div>';
}
function miniProgress(fact, plan, expected){
  if (plan == null) return '<span class="dim small">план не задан</span>';
  if (fact == null) return na('нет факта');
  const fp = F.share(fact, plan), ps = paceStatus(fp, expected);
  return '<div class="bar" style="height:14px;margin:2px 0"><div class="fill" style="width:' + Math.max(0, Math.min(fp, 100)) + '%;background:var(--' + ps.cls + ')"></div><div class="mark" style="left:' + Math.min(expected,100) + '%"></div></div><span class="small ' + ps.cls + '">' + NF0.format(fp) + '% · ' + ps.t + '</span>';
}

function productDetail(s, m){
  // нитка прибыли по товару
  let wf;
  if (s.rev == null) wf = '<div class="nabox">' + esc(m.st.revenue.reason) + '</div>';
  else {
    const steps = [['Выручка', s.rev]];
    steps.push(['Себестоимость', s.cogs == null ? null : -s.cogs]);
    COST_ITEMS.forEach(k => steps.push([ITEM_LABELS[k], s.items[k] == null ? null : -s.items[k]]));
    const max = Math.max(Math.abs(s.rev), 1);
    wf = '<div class="wf">' + steps.map(([l,v]) => '<div>' + l + '</div><div class="t">' + (v == null ? '' : '<i style="left:0;width:' + Math.min(Math.abs(v)/max*100,100) + '%;background:' + (l === 'Выручка' ? 'var(--accent)' : 'var(--bad)') + '"></i>') + '</div><div class="num">' + (v == null ? na(l === 'Себестоимость' ? 'не заполнена' : 'статья не найдена в отчётах', 'н/д') : NF0.format(v) + ' ₽') + '</div>').join('') +
      '<div><b>Прибыль</b></div><div class="t">' + (s.profit == null ? '' : '<i style="width:' + Math.min(Math.abs(s.profit)/max*100,100) + '%;background:var(--' + (s.profit >= 0 ? 'good' : 'bad') + ')"></i>') + '</div><div class="num"><b>' + (s.profit == null ? na(s.profitReason) : rub(s.profit)) + '</b></div></div>';
  }
  // мини-воронка
  let fn;
  if (!s.fun) fn = '<div class="nabox">Нет отчёта аналитики по дням за выбранный период — воронка недоступна.</div>';
  else {
    const stp = [['Показы', s.fun.impr], ['Визиты в карточку', s.fun.views], ['В корзину', s.fun.carts], ['Заказано', s.fun.ordered], ['Доставлено', s.ord ? s.ord.delivered : null]];
    fn = funnelHtml(stp, 'нет отчёта по заказам');
  }
  const stk = !s.stock ? na('нет отчёта по остаткам') : int(s.stock.available) + ' шт.' + (s.stock.inTransit ? ' (+' + int(s.stock.inTransit) + ' в пути)' : '');
  return '<div class="grid g3"><div><h3 style="font-size:13px;margin:0 0 8px">Нитка прибыли</h3>' + wf + (Object.keys(s.alloc).length ? '<div class="note">Включает распределённые расходы без SKU: ' + Object.entries(s.alloc).filter(([k,v]) => v != null && Math.abs(v) >= 1).map(([k,v]) => ITEM_LABELS[k] + ' ' + NF0.format(v) + ' ₽').join(', ') + '</div>' : '') + '</div>' +
    '<div><h3 style="font-size:13px;margin:0 0 8px">Воронка</h3>' + fn + (s.buyout != null ? '<div class="note">Выкуп: ' + pct(s.buyout) + '</div>' : '') + '</div>' +
    '<div><h3 style="font-size:13px;margin:0 0 8px">Остаток и поставка</h3><div class="statgrid" style="grid-template-columns:1fr 1fr">' + stat('Остаток', stk, s.stock ? 'на ' + fmtDate(s.stock.date) : '') + stat('Скорость', s.velocity == null ? na(s.velSrc) : dec(s.velocity) + ' шт/день', esc(s.velSrc)) +
    stat('Хватит на', daysLeftHtml(s), s.zeroDate ? 'обнулится ≈ ' + fmtDate(s.zeroDate) : '') + stat('ABC', 'приб. ' + abcChip(s.abcProfit, s.profitReason ? s.profitReason : '') + ' выр. ' + abcChip(s.abcRevenue, ''), '') + '</div>' +
    '<div class="note ' + s.advice.cls + '" style="font-size:13px"><b>Рекомендация:</b> ' + esc(s.advice.t) + '</div></div></div>';
}
function funnelHtml(steps, deliveredReason){
  const max = Math.max(...steps.map(x => x[1] == null ? 0 : x[1]), 1);
  let h = '<div class="funnel">';
  steps.forEach(([l,v], i) => {
    if (i > 0){ const p = steps[i-1][1]; h += '<div class="cv">↓ конверсия ' + (v == null || p == null || p <= 0 ? na(v == null ? deliveredReason : 'нет базы', 'н/д') : NF2.format(v / p * 100) + '%') + '</div>'; }
    h += '<div class="st"><div>' + l + '</div><div class="t">' + (v == null ? '' : '<i style="width:' + Math.max(v/max*100, v > 0 ? 0.8 : 0) + '%"></i>') + '</div><div class="num">' + (v == null ? na(deliveredReason) : NF0.format(v)) + '</div></div>';
  });
  return h + '</div>';
}
function daysLeftHtml(s){
  if (s.daysLeft == null) return na(!s.stock ? 'нет отчёта по остаткам' : s.velSrc);
  if (s.daysLeft === Infinity) return '<span class="muted">нет продаж</span>';
  const cls = s.stockStatus === 'crit' ? 'bad' : s.stockStatus === 'warn' ? 'warn' : 'good';
  return '<span class="' + cls + '">' + NF0.format(s.daysLeft) + ' дн.</span>';
}

function renderStocks(el, m){

  const list = m.list.filter(s => s.stock && !s.stock.absent);

    stat('<span class="good">В норме</span>', '<span class="good">' + cnt('ok') + '</span>', 'товаров') + stat('Без продаж за период', noSales, 'остаток не расходуется') + (noData ? stat('Нет данных', na('нет скорости продаж'), noData + ' товаров') : '') + '</div>' +

    '<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Распределение по сроку до обнуления</h3><div class="chartbox sm"><canvas id="chStockHist"></canvas></div></div>' +

      {k:'name', l:'Товар', v:s => s.name, h:nameCell},

      {k:'abc', l:'ABC приб.', v:s => s.abcProfit, h:s => abcChip(s.abcProfit, s.profitReason ? s.profitReason : '')},

    ], list.slice(), {defKey:'days', defDir:1}) + '</div>';
  bindThresholds();

    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{precision:0}}}}});
}
function bindThresholds(){
  [['thCrit','critDays'],['thWarn','warnDays'],['thTarget','targetDays']].forEach(([id,k]) => { const e = document.getElementById(id); if (e) e.onchange = () => { const v = parseNum(e.value); if (v != null && v > 0){ state.settings[k] = v; LS.set('settings', state.settings); recompute(); } }; });
}
