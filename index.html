      '</tbody></table></div>' : '<div class="muted">Пока ничего не загружено.</div>') +
    '<div class="filters" style="margin-top:12px"><button id="btnReset" class="sm">Удалить все загруженные отчёты</button><button id="btnResetCosts" class="sm">Сбросить ручную себестоимость</button></div></div>' +
    (fin.length ? '<div class="card" style="margin-top:14px"><h3>Как классифицированы начисления <small>правило: группа/тип начисления → статья формулы прибыли</small></h3><div class="tblwrap" style="max-height:420px"><table><thead><tr><th>Группа услуг</th><th>Тип начисления</th><th>Статья</th><th class="num">Строк</th><th class="num">Сумма</th></tr></thead><tbody>' +
      mergeAccruals(fin).map(a => '<tr><td>' + esc(a.group) + '</td><td>' + esc(a.type) + '</td><td><span class="chip">' + ITEM_LABELS[a.item] + '</span></td><td class="num">' + a.n + '</td><td class="num ' + signCls(a.sum) + '">' + NF0.format(a.sum) + ' ₽</td></tr>').join('') + '</tbody></table></div></div>' : '') +
    '<div class="card" style="margin-top:14px"><h3>Справка</h3>' + reportsHelp() + '<div class="note">Все данные хранятся только в этом браузере (localStorage) и привязаны к адресу сайта: при открытии файла локально (file://) и на GitHub Pages — это разные хранилища.</div></div>';
  $('#btnUpload2').onclick = () => $('#fileInput').click();
  $('#btnReset').onclick = () => { if (confirm('Удалить все загруженные отчёты из браузера? Себестоимость, планы и срезы сохранятся.')){ state.batches = []; dataVersion++; persistBatches(); state.lastResults = []; renderUploadResults(); recompute(); } };
  $('#btnResetCosts').onclick = () => { if (confirm('Удалить всю вручную введённую себестоимость?')){ state.manualCosts = {}; LS.set('manualCosts', state.manualCosts); recompute(); } };
}
function mergeAccruals(fin){ const m = {}; fin.forEach(b => b.meta.accruals.forEach(a => { const k = a.group + '|' + a.type; if (!m[k]) m[k] = Object.assign({}, a, {sum:0, n:0}); m[k].sum += a.sum; m[k].n += a.n; })); return Object.values(m).sort((a,b) => Math.abs(b.sum) - Math.abs(a.sum)); }

/* =====================================================================
   17. ЗАГРУЗКА ФАЙЛОВ, ОТЧЁТ О РАСПОЗНАВАНИИ, РУЧНОЙ ВЫБОР ТИПА
   ===================================================================== */
const pendingManual = {};
async function handleFiles(files){
  if (typeof XLSX === 'undefined'){ alert('Библиотека SheetJS не загрузилась (нет доступа к cdnjs.cloudflare.com). Проверьте интернет и обновите страницу.'); return; }
  $('#busy').classList.add('on');
  const results = [];
  for (const file of files){
    await new Promise(r => setTimeout(r, 30)); // дать браузеру отрисовать индикатор
    try {
      const wb = await readWorkbook(file);
      const an = analyzeWorkbook(wb);
      const best = an.cands[0];
      if (!best || best.ratio < 0.5){
        const id = 'p' + Math.random().toString(36).slice(2,8);
        pendingManual[id] = {file, an};
        results.push({status:'choose', file:file.name, id, an, best});
        continue;
      }
      if (!best.reqOk){ results.push({status:'error', file:file.name, msg:'Файл похож на «' + REPORT_TYPES[best.type].label + '» (лист «' + best.sheet + '», совпало ' + Math.round(best.ratio*100) + '% ключевых колонок), но в нём не найдены обязательные колонки:', list: best.missingReq.map(c => '«' + c + '»'), headers: best.header.headers}); continue; }
      results.push(await commitWithReport(file, best));
    } catch(e){
      console.error(e);
      results.push({status:'error', file:file.name, msg:'Не удалось прочитать файл: ' + e.message + '. Убедитесь, что это выгрузка .xlsx или .csv из личного кабинета Ozon и файл не повреждён.'});
    }
  }
  $('#busy').classList.remove('on');
  state.lastResults = results.concat(state.lastResults).slice(0, 12);
  persistBatches();
  renderUploadResults();
  recompute();   // полный пересчёт всех вкладок, графиков и выводов
}
async function commitWithReport(file, cand){
  const batch = buildBatch(file, cand);
  if (!batch.rows.length) return {status:'error', file:file.name, msg:'Тип определён как «' + REPORT_TYPES[cand.type].label + '», заголовок найден в строке ' + (cand.header.row + 1) + ', но ни одна строка данных не распознана (пропущено ' + batch.report.skipped + ' строк: пустые даты/SKU/суммы).'};
  const r = await commitBatch(batch);
  if (r.status === 'ok') r.file = file.name;
  return r;
}
function renderUploadResults(){
  const el = $('#uploadResults'), rs = state.lastResults;
  if (!rs.length){ el.innerHTML = ''; return; }
  el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>Результат загрузки</b><button class="sm ghost" id="closeRes">Скрыть</button></div>' + rs.map(r => {
    if (r.status === 'ok'){ const b = r.batch, rp = b.report;
      return '<div class="res ok"><h4>✓ ' + esc(r.file) + '</h4><dl>' +
        '<dt>Тип отчёта</dt><dd>' + esc(rp.typeLabel) + ' <span class="dim">(лист «' + esc(rp.sheet) + '», заголовок в строке ' + rp.headerRow + (rp.headerSpan > 1 ? '–' + (rp.headerRow + 1) : '') + ', совпало ' + rp.confidence + '% ключевых колонок)</span></dd>' +
        '<dt>Период</dt><dd>' + (b.type === 'cost' ? '<span class="dim">не требуется — справочник себестоимости по SKU/артикулу</span>' : b.from ? fmtRange({from:b.from, to:b.to}) + ' <span class="dim">(' + esc(rp.periodSource) + ')</span>' : na('период в файле не найден')) + '</dd>' +
        '<dt>Распознано строк</dt><dd>' + NF0.format(rp.total) + (rp.finalRows !== rp.total ? ' → ' + NF0.format(rp.finalRows) + ' SKU после суммирования по складам' : '') + (rp.skipped ? ' <span class="dim">(пропущено служебных/итоговых строк: ' + rp.skipped + ')</span>' : '') + '</dd>' +
        '<dt>Не найдены колонки</dt><dd>' + (rp.missingOpt.length ? '<span class="warn">' + esc(rp.missingOpt.join(', ')) + '</span>' : '<span class="good">все ожидаемые колонки найдены</span>') + '</dd>' +
        '<dt>Себестоимость</dt><dd>' + (rp.costColumn ? '<span class="chip src-report">найдена колонка «' + esc(rp.costColumn) + '»</span>' : '<span class="dim">колонки себестоимости в файле нет</span>') + '</dd>' +
        (r.action === 'replace' ? '<dt>Перекрытие</dt><dd>данные за период заменили строки из: ' + esc(r.overlapped.join(', ')) + '</dd>' : r.action === 'merge' ? '<dt>Перекрытие</dt><dd>объединено с: ' + esc(r.overlapped.join(', ')) + ' (совпадающие строки взяты из нового файла)</dd>' : '') +
        '</dl></div>'; }
    if (r.status === 'skip') return '<div class="res"><h4>' + esc(r.file) + '</h4>' + esc(r.msg) + '</div>';
    if (r.status === 'error') return '<div class="res err"><h4>✕ ' + esc(r.file) + '</h4>' + esc(r.msg) + (r.list ? '<ul>' + r.list.map(x => '<li><b>' + esc(x) + '</b></li>').join('') + '</ul>' : '') + (r.headers ? '<div class="note">Найденные заголовки: ' + esc(r.headers.filter(Boolean).join(' | ')) + '</div>' : '') + '</div>';
    if (r.status === 'choose'){
      if (!pendingManual[r.id]) return '<div class="res"><h4>' + esc(r.file) + '</h4><span class="muted">Файл ожидал ручного выбора типа — после перезагрузки страницы загрузите его снова.</span></div>';
      return '<div class="res ask"><h4>? ' + esc(r.file) + ' — тип отчёта не определён уверенно</h4><div class="small muted">' + (r.best ? 'Лучшее совпадение: «' + esc(REPORT_TYPES[r.best.type].label) + '» — только ' + Math.round(r.best.ratio*100) + '% ключевых колонок (нужно не меньше 50%).' : 'Ни один тип отчёта не подошёл.') + ' Проверьте, что это за файл, и выберите тип вручную.</div>' +
        r.an.sheets.map(sh => { const g = guessHeaderRow(sh.rows); return '<div class="note"><b>Лист «' + esc(sh.name) + '»</b>, строк: ' + sh.rows.length + '. Колонки (строка ' + (g.row + 1) + '): ' + esc(g.cols.slice(0, 30).join(' | ')) + '</div>'; }).join('') +
        '<div class="filters" style="margin-top:8px"><select id="sel-' + r.id + '">' + Object.entries(REPORT_TYPES).map(([k,T]) => '<option value="' + k + '">' + esc(T.label) + '</option>').join('') + '</select><button class="primary sm" data-manual="' + r.id + '">Применить тип</button><button class="sm" data-manualskip="' + r.id + '">Пропустить файл</button></div></div>';
    }
    return '';
  }).join('');
  $('#closeRes').onclick = () => { state.lastResults = []; renderUploadResults(); };
}
async function applyManualType(id){
  const p = pendingManual[id]; if (!p) return;
  const type = $('#sel-' + id).value;
  const cands = p.an.cands.filter(c => c.type === type);
  const idx = state.lastResults.findIndex(r => r.id === id);
  let res;
  if (!cands.length) res = {status:'error', file:p.file.name, msg:'Для типа «' + REPORT_TYPES[type].label + '» в файле не найдено ни одной ожидаемой колонки. Обязательные колонки:', list: Object.values(REPORT_TYPES[type].cols).filter(c => c.r).map(c => '«' + c.l + '»')};
  else { const c = cands[0];
    if (!c.reqOk) res = {status:'error', file:p.file.name, msg:'Выбран тип «' + REPORT_TYPES[type].label + '», но в файле (лист «' + c.sheet + '») не найдены обязательные колонки:', list: c.missingReq.map(x => '«' + x + '»'), headers: c.header.headers};
    else res = await commitWithReport(p.file, c); }
  delete pendingManual[id];
  state.lastResults[idx] = res;
  persistBatches(); renderUploadResults(); recompute();
}

/* ---------- Модальные окна ---------- */
function modal(html){ const root = $('#modalRoot'); root.innerHTML = '<div class="modal-bg"><div class="modal">' + html + '</div></div>'; return root; }
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function askOverlap(batch, olds){
  return new Promise(resolve => {
    const T = REPORT_TYPES[batch.type];
    const root = modal('<h3>Данные за этот период уже загружены</h3><p>Новый файл <b>«' + esc(batch.fileName) + '»</b> (' + esc(T.short) + (batch.from ? ', ' + fmtRange({from:batch.from, to:batch.to}) : '') + ') пересекается с уже загруженными:</p><ul>' +
      olds.map(o => '<li>«' + esc(o.fileName) + '»' + (o.from ? ', ' + fmtRange({from:o.from, to:o.to}) : '') + ', ' + NF0.format(o.rows.length) + ' строк</li>').join('') + '</ul>' +
      '<p class="small muted"><b>Заменить</b> — строки старых файлов за период нового файла удаляются (если старая выгрузка была черновой или неполной).<br><b>Объединить</b> — сохраняются оба набора; одинаковые строки не дублируются, при совпадении берётся версия из нового файла.</p>' +
      '<div class="acts"><button data-a="cancel">Не загружать</button><button data-a="merge">Объединить</button><button class="primary" data-a="replace">Заменить</button></div>');
    root.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { closeModal(); resolve(b.dataset.a); });
  });
}
function openSettings(){
  const S = state.settings;
  const root = modal('<h3>Настройки</h3><div class="form">' +
    '<label>Ставка налога, % от выручки<div class="small muted">В отчётах Ozon налога нет. Пусто — налог не учитывается и будет в списке «не учтено».</div></label><input type="number" id="sTax" step="0.1" min="0" value="' + (S.taxRate != null ? S.taxRate : '') + '" placeholder="например, 6">' +
    '<label>Критичный остаток, дней</label><input type="number" id="sCrit" min="1" value="' + S.critDays + '">' +
    '<label>Остаток «требует внимания», дней</label><input type="number" id="sWarn" min="1" value="' + S.warnDays + '">' +
    '<label>Поставка на, дней</label><input type="number" id="sTarget" min="1" value="' + S.targetDays + '">' +
    '<label>Ориентир ДРР: от, %</label><input type="number" id="sDrrL" step="0.5" value="' + S.drrLow + '">' +
    '<label>Ориентир ДРР: до, %</label><input type="number" id="sDrrH" step="0.5" value="' + S.drrHigh + '">' +
    '<label>Минимум показов для анализа воронки</label><input type="number" id="sMinImpr" min="0" value="' + S.minImpr + '">' +
    '</div><div class="acts"><button data-a="cancel">Отмена</button><button class="primary" data-a="save">Сохранить</button></div>');
  root.querySelector('[data-a=cancel]').onclick = closeModal;
  root.querySelector('[data-a=save]').onclick = () => {
    const g = id => parseNum($('#' + id).value);
    S.taxRate = g('sTax');
    [['sCrit','critDays'],['sWarn','warnDays'],['sTarget','targetDays'],['sDrrL','drrLow'],['sDrrH','drrHigh'],['sMinImpr','minImpr']].forEach(([id,k]) => { const v = g(id); if (v != null && v >= 0) S[k] = v; });
    LS.set('settings', S); closeModal(); recompute();
  };
}
function saveSnapshot(){
  const m = state.model; if (!m){ alert('Нет данных для среза — сначала загрузите отчёты.'); return; }
  const A = m.all;
  state.snapshots.push({ts: new Date().toISOString(), period:{from:m.per.from, to:m.per.to}, rev:A.rev, profit:A.profitCovered, coverage:A.coverage, margin:A.margin, drr:A.drr});
  LS.set('snapshots', state.snapshots);
  if (state.ui.tab === 'overview') renderActive();
  const b = $('#btnSnap'); b.textContent = 'Срез сохранён ✓'; setTimeout(() => { b.textContent = 'Сохранить срез'; }, 1600);
}

/* =====================================================================
   18. ИНИЦИАЛИЗАЦИЯ И ОБРАБОТЧИКИ СОБЫТИЙ
   ===================================================================== */
function init(){
  $('#ver').textContent = 'v' + APP_VERSION + ' · сборка ' + BUILD_TIME;
  const missingLibs = [typeof XLSX === 'undefined' ? 'SheetJS (xlsx)' : null, typeof Chart === 'undefined' ? 'Chart.js' : null].filter(Boolean);
  if (missingLibs.length) $('#libError').innerHTML = '<div class="errbox" style="margin-bottom:12px">Не загрузились библиотеки: ' + missingLibs.join(', ') + '. Нужен доступ к cdnjs.cloudflare.com. ' + (typeof XLSX === 'undefined' ? 'Загрузка отчётов невозможна.' : 'Графики не будут показаны.') + '</div>';
  if (typeof Chart !== 'undefined'){ Chart.defaults.color = '#8e96a9'; Chart.defaults.borderColor = '#272c39'; Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif'; }
  loadState();
  recompute();
  $('#btnUpload').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) handleFiles(f); };
  $('#btnSettings').onclick = openSettings;
  $('#btnSnap').onclick = saveSnapshot;
  // drag & drop на всю страницу
  document.addEventListener('dragover', e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); });
  document.addEventListener('dragleave', e => { const d = $('#drop'); if (d && e.target === d) d.classList.remove('over'); });
  document.addEventListener('drop', e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); const f = [...e.dataTransfer.files]; if (f.length) handleFiles(f); });
  // делегирование кликов
  document.addEventListener('click', e => {
    const t = e.target;
    const tab = t.closest('[data-tab]'); if (tab){ state.ui.tab = tab.dataset.tab; renderTabs(); renderActive(); return; }
    const go = t.closest('[data-goto]'); if (go){ e.preventDefault(); state.ui.tab = go.dataset.goto; renderTabs(); renderActive(); window.scrollTo({top: $('#tabs').offsetTop - 70, behavior:'smooth'}); return; }
    const th = t.closest('th[data-sort]');
    if (th){ const [id, k] = th.dataset.sort.split(':'); const cur = state.ui.sorts[id]; state.ui.sorts[id] = {k, d: cur && cur.k === k ? -cur.d : -1}; rerenderTable(id); return; }
    if (t.closest('input,select,button,a')) {
      const mb = t.closest('[data-manual]'); if (mb){ applyManualType(mb.dataset.manual); return; }
      const ms = t.closest('[data-manualskip]'); if (ms){ delete pendingManual[ms.dataset.manualskip]; state.lastResults = state.lastResults.filter(r => r.id !== ms.dataset.manualskip); renderUploadResults(); return; }
      const db = t.closest('[data-delbatch]'); if (db){ const b = state.batches.find(x => x.id === db.dataset.delbatch); if (b && confirm('Удалить отчёт «' + b.fileName + '» из браузера?')){ state.batches = state.batches.filter(x => x !== b); dataVersion++; persistBatches(); recompute(); } return; }
      const ds = t.closest('[data-delsnap]'); if (ds){ state.snapshots = state.snapshots.filter(s => s.ts !== ds.dataset.delsnap); LS.set('snapshots', state.snapshots); renderActive(); return; }
      return;
    }
    const row = t.closest('tr[data-expand]'); if (row){ const sku = row.dataset.expand; state.ui.expanded = state.ui.expanded === sku ? null : sku; renderProductsTable(state.model); return; }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.costSku){ setManualCost(t.dataset.costSku, t.value.trim()); return; }
    if (t.dataset.filter && t.tagName === 'SELECT'){ const [id, k] = t.dataset.filter.split(':'); state.ui.filters[id][k] = t.value; rerenderTable(id); }
  });
  document.addEventListener('input', e => { const t = e.target; if (t.dataset.filter && t.tagName === 'INPUT'){ const [id, k] = t.dataset.filter.split(':'); state.ui.filters[id][k] = t.value; rerenderTable(id); } });
}
function rerenderTable(id){
  const m = state.model; if (!m) return;
  if (id === 'unit') renderUnitTable(m); else if (id === 'prod') renderProductsTable(m); else renderActive();
}
init();
</script>
</body>
